<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Складской журнал операций</title>
    <link rel="stylesheet" href="logs.css">
</head>
<body>

<div class="container">
    <a href="/" class="back-btn">← На главную в склад</a>
    <h1>Журнал движения запчастей и операций</h1>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('Приход', '/api/get-receipt-logs', this)">Приходы</button>
        <button class="tab-btn" onclick="switchTab('Перемещение', '/api/get-move-logs', this)"> Перемещения</button>
        <button class="tab-btn" onclick="switchTab('Ремонт', '/api/get-repair-logs', this)"> Ремонт</button>
        <button class="tab-btn" onclick="switchTab('Возврат', '/api/get-return-logs', this)"> Возврат запчастей</button>
        <button class="tab-btn" onclick="switchTab('Реализация', '/api/get-realization-logs', this)"> Реализация</button>
        <button class="tab-btn" onclick="switchTab('Проведения', '/api/get-posting-logs', this)"> Проведения документов</button>
         <button class="tab-btn" onclick="switchTab('Оплаты клиентов', '/api/get-customer-payment-logs', this)"> Оплаты клиентов</button>
        <button class="tab-btn" onclick="switchTab('Оплаты поставщикам', '/api/get-supplier-payment-logs', this)"> Оплаты поставщикам</button>
       <button class="tab-btn" onclick="switchTab('Оплаты по перемещениям', '/api/get-move-payment-logs', this)"> Оплаты по перемещениям</button>
            <button class="tab-btn" onclick="switchTab('Аудит', '/api/get-audit-logs', this)"> Общая история</button>

    </div>

    <div id="logs-pager"></div>

    <table>
        <thead id="table-head">
        </thead>
        <tbody id="logs-table-body">
            <tr><td colspan="10" style="text-align: center;">Загрузка данных...</td></tr>
        </tbody>
    </table>
</div>

<script src="logs.js"></script>
</body>
</html>
